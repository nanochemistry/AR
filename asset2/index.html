<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Video Portal</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        /* Modernes UI Font-Setup */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* UI Layer (Gesten gehen dank 'pointer-events: none' durch) */
        #ar-ui-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 16px; box-sizing: border-box;
        }

        /* Top Bar: Status Badge */
        .ui-top-bar { display: flex; justify-content: flex-start; width: 100%; }

        .status-badge {
            background: rgba(15, 15, 20, 0.75);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; padding: 8px 14px; border-radius: 20px;
            font-size: 13px; font-weight: 500; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background-color: #ff4b4b; box-shadow: 0 0 8px #ff4b4b;
            transition: all 0.3s ease;
        }

        .status-badge.tracked { border-color: rgba(0, 255, 150, 0.3); }
        .status-badge.tracked .status-dot { background-color: #00ff96; box-shadow: 0 0 10px #00ff96; }

        /* Bottom Bar: Video Info Card */
        .ui-bottom-bar { display: flex; justify-content: center; width: 100%; margin-bottom: env(safe-area-inset-bottom, 0px); }

        .video-card {
            background: rgba(15, 15, 20, 0.75);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 16px; width: 100%; max-width: 360px;
            color: #fff; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transform: translateY(20px); opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        .video-card.visible { transform: translateY(0); opacity: 1; }
        .video-title { font-size: 18px; font-weight: 600; margin: 0 0 4px 0; }
        .video-subtitle { font-size: 12px; color: #8a8a93; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

        /* Daten-Raster */
        .info-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 12px;
        }

        .info-item { display: flex; flex-direction: column; }
        .info-label { font-size: 11px; color: #fff; text-transform: uppercase; margin-bottom: 2px; opacity: 0.5; }
        .info-value { font-size: 14px; font-weight: 500; color: #f2f2f7; }

        /* Lade-Screen */
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #09090b; color: #fff; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        
        #start-btn {
            padding: 12px 28px; font-size: 15px; font-weight: 600; background: #fff; color: #000; 
            border: none; border-radius: 24px; cursor: pointer; margin-top: 20px;
            box-shadow: 0 4px 20px rgba(255,255,255,0.2); display: none;
        }

        video { width: 100vw !important; height: 100vh !important; object-fit: cover !important; position: absolute; top: 0; left: 0; z-index: 1 !important; }
        .a-canvas { width: 100vw !important; height: 100vh !important; position: absolute; top: 0; left: 0; z-index: 2 !important; }
    </style>

    <script>
        // HOCHPERFORMANTE VIDEO-STEUERUNG
        AFRAME.registerComponent('video-handler', {
            init: function () {
                this.video = document.getElementById('ar-video');
                this.statusBadge = document.getElementById('status-badge');
                this.statusText = document.getElementById('status-text');
                this.videoCard = document.getElementById('video-card');
                
                this.isVisible = false;

                // Holt sich das übergeordnete MindAR-Target
                const targetEntity = this.el.closest('[mindar-image-target]');
                if (targetEntity) {
                    targetEntity.addEventListener('targetFound', () => { 
                        this.isVisible = true; 
                        if (this.video) this.video.play();
                        
                        // UI aktualisieren
                        if(this.statusBadge) this.statusBadge.classList.add('tracked');
                        if(this.statusText) this.statusText.innerText = "Video aktiv";
                        if(this.videoCard) this.videoCard.classList.add('visible');
                    });
                    
                    targetEntity.addEventListener('targetLost', () => { 
                        this.isVisible = false; 
                        if (this.video) this.video.pause();
                        
                        // UI zurücksetzen
                        if(this.statusBadge) this.statusBadge.classList.remove('tracked');
                        if(this.statusText) this.statusText.innerText = "Suche Marker...";
                        if(this.videoCard) this.videoCard.classList.remove('visible');
                    });
                }
            }
        });
    </script>
</head>
<body>

    <div id="ar-ui-layer">
        <div class="ui-top-bar">
            <div id="status-badge" class="status-badge">
                <div class="status-dot"></div>
                <span id="status-text">Suche Marker...</span>
            </div>
        </div>

        <div class="ui-bottom-bar">
            <div id="video-card" class="video-card">
                <div class="video-title">Reaktionsmechanismus</div>
                <div class="video-subtitle">Video Demonstration</div>
                
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Inhalt</span>
                        <span class="info-value">CVD Kinetik</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Format</span>
                        <span class="info-value">1080p MP4</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="loading">
        <h2 style="font-weight: 400; letter-spacing: 1px;">Nanochemistry AR Video</h2>
        <p id="init-text" style="color: #8a8a93; font-size: 14px;">Initialisiere Video-Infrastruktur...</p>
        <button id="start-btn">AR Video Starten</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; filterMinCF: 0.0005; filterBeta: 0.001;" 
             embedded 
             renderer="colorManagement: true; alpha: true;"
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="ar-video" 
                   src="./video.mp4" 
                   preload="auto" 
                   loop="true" 
                   playsinline 
                   webkit-playsinline 
                   crossorigin="anonymous" 
                   muted>
            </video>
        </a-assets>
        
        <a-camera position="0 0 0" look-controls="enabled: false" mindar-image-camera></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-entity video-handler>
                
                <a-video src="#ar-video" 
                         position="0 0 0.12" 
                         width="1.6" 
                         height="0.9" 
                         rotation="0 0 0">
                </a-video>
                
            </a-entity>
        </a-entity>
        
    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const loadingEl = document.getElementById('loading');
        const initText = document.getElementById('init-text');
        const startBtn = document.getElementById('start-btn');

        sceneEl.addEventListener("arReady", () => {
            initText.innerText = "System einsatzbereit.";
            startBtn.style.display = "block";
        });

        // WICHTIG: Entsperrt die native Audio-/Video-Engine von iOS/Safari durch den Klick
        startBtn.addEventListener('click', () => {
            loadingEl.style.display = 'none';
            
            const video = document.getElementById('ar-video');
            if (video) {
                video.play().then(() => {
                    video.pause(); 
                    video.muted = false; // Video hat nun Sound, sobald der Marker im Bild erscheint!
                }).catch(err => {
                    console.log("Autoplay-Freigabe fehlgeschlagen, spiele lautlos ab:", err);
                });
            }
        });
    </script>
</body>
</html>
