<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Video Portal</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* UI LAYER (Erhöhter Z-Index gegen MindAR-Injektionen) */
        #ar-ui-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 888888 !important; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 16px; box-sizing: border-box;
        }

        /* Top Bar: Status Badge */
        .ui-top-bar { display: flex; justify-content: flex-start; width: 100%; }

        .status-badge {
            background: rgba(15, 15, 20, 0.75);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; padding: 8px 14px; border-radius: 20px;
            font-size: 13px; font-weight: 500; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background-color: #ff4b4b; box-shadow: 0 0 8px #ff4b4b;
            transition: all 0.3s ease;
        }

        .status-badge.tracked { border-color: rgba(0, 255, 150, 0.3); }
        .status-badge.tracked .status-dot { background-color: #00ff96; box-shadow: 0 0 10px #00ff96; }

        /* Bottom Bar: Ultraschlanke Video Card ohne Raster */
        .ui-bottom-bar { display: flex; justify-content: center; width: 100%; margin-bottom: env(safe-area-inset-bottom, 0px); }

        .video-card {
            background: rgba(15, 15, 20, 0.75);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 14px; width: 100%; max-width: 340px;
            color: #fff; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transform: translateY(20px); opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        .video-card.visible { transform: translateY(0); opacity: 1; }
        .video-title { font-size: 16px; font-weight: 600; margin: 0 0 2px 0; }
        .video-subtitle { font-size: 11px; color: #8a8a93; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

        /* Video-Controls Zeile */
        .video-controls {
            display: flex; align-items: center; gap: 12px;
            pointer-events: auto;
        }

        .play-btn {
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 11px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: background 0.2s; -webkit-tap-highlight-color: transparent;
        }
        .play-btn:active { background: rgba(255, 255, 255, 0.3); }

        .timeline-slider {
            flex-grow: 1; -webkit-appearance: none; appearance: none;
            height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.2);
            outline: none; cursor: pointer; accent-color: #00ff96;
        }
        .timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 12px; height: 12px;
            border-radius: 50%; background: #00ff96; cursor: pointer; box-shadow: 0 0 6px #00ff96;
        }

        /* LADE-SCREEN (Absolut dominant erzwungen über !important) */
        #loading {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #09090b !important; color: #fff; 
            z-index: 999999 !important; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        
        #start-btn {
            padding: 12px 28px; font-size: 15px; font-weight: 600; background: #fff; color: #000; 
            border: none; border-radius: 24px; cursor: pointer; margin-top: 20px;
            box-shadow: 0 4px 20px rgba(255,255,255,0.2); display: none;
        }

        /* Native Video/Canvas Schranken für den Hintergrund */
        video { width: 100vw !important; height: 100vh !important; object-fit: cover !important; position: absolute; top: 0; left: 0; z-index: 1 !important; }
        .a-canvas { width: 100vw !important; height: 100vh !important; position: absolute; top: 0; left: 0; z-index: 2 !important; }
    </style>

    <script>
        AFRAME.registerComponent('video-handler', {
            init: function () {
                this.video = document.getElementById('ar-video');
                this.loadingText = document.getElementById('ar-loading-text');
                this.statusBadge = document.getElementById('status-badge');
                this.statusText = document.getElementById('status-text');
                this.videoCard = document.getElementById('video-card');
                this.uiPlayBtn = document.getElementById('ui-play-btn');
                
                this.isVisible = false;

                // Erkennt Puffer-Zustände des Videos im 3D Raum
                this.video.addEventListener('waiting', () => {
                    if (this.isVisible && this.loadingText) this.loadingText.setAttribute('visible', true);
                });

                this.video.addEventListener('playing', () => {
                    if (this.loadingText) this.loadingText.setAttribute('visible', false);
                });

                const targetEntity = this.el.closest('[mindar-image-target]');
                if (targetEntity) {
                    targetEntity.addEventListener('targetFound', () => { 
                        this.isVisible = true; 
                        if (this.video) {
                            this.video.play();
                            if(this.uiPlayBtn) this.uiPlayBtn.innerText = "⏸";
                        }
                        
                        if(this.statusBadge) this.statusBadge.classList.add('tracked');
                        if(this.statusText) this.statusText.innerText = "Video aktiv";
                        if(this.videoCard) this.videoCard.classList.add('visible');
                    });
                    
                    targetEntity.addEventListener('targetLost', () => { 
                        this.isVisible = false; 
                        if (this.video) this.video.pause();
                        
                        if (this.loadingText) this.loadingText.setAttribute('visible', false);
                        
                        if(this.statusBadge) this.statusBadge.classList.remove('tracked');
                        if(this.statusText) this.statusText.innerText = "Suche Marker...";
                        if(this.videoCard) this.videoCard.classList.remove('visible');
                    });
                }
            }
        });
    </script>
</head>
<body>

    <div id="ar-ui-layer">
        <div class="ui-top-bar">
            <div id="status-badge" class="status-badge">
                <div class="status-dot"></div>
                <span id="status-text">Suche Marker...</span>
            </div>
        </div>

        <div class="ui-bottom-bar">
            <div id="video-card" class="video-card">
                <div class="video-title">Reaktionsmechanismus</div>
                <div class="video-subtitle">Video Demonstration</div>
                
                <div class="video-controls">
                    <button id="ui-play-btn" class="play-btn">▶</button>
                    <input type="range" id="ui-timeline" class="timeline-slider" min="0" max="100" value="0">
                </div>
            </div>
        </div>
    </div>

    <div id="loading">
        <h2 style="font-weight: 400; letter-spacing: 1px; margin-bottom: 5px;">Nanochemistry AR Video</h2>
        <p id="init-text" style="color: #8a8a93; font-size: 14px; margin: 0;">Initialisiere Video-Infrastruktur...</p>
        <button id="start-btn">AR Video Starten</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; filterMinCF: 0.0005; filterBeta: 0.001;" 
             embedded 
             renderer="colorManagement: true; alpha: true;"
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="ar-video" 
                   src="./video.mp4" 
                   preload="auto" 
                   loop="true" 
                   playsinline 
                   webkit-playsinline 
                   crossorigin="anonymous" 
                   muted>
            </video>
        </a-assets>
        
        <a-camera position="0 0 0" look-controls="enabled: false" mindar-image-camera></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-entity video-handler>
                
                <a-video src="#ar-video" position="0 0 0.3" width="3.2" height="1.8" rotation="0 0 0"></a-video>
                
                <a-text id="ar-loading-text" 
                        value="Video loading..." 
                        align="center" 
                        position="0 0 0.14" 
                        scale="0.5 0.5 0.5" 
                        color="#00ff96"
                        visible="true">
                </a-text>
                
            </a-entity>
        </a-entity>
        
    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const loadingEl = document.getElementById('loading');
        const initText = document.getElementById('init-text');
        const startBtn = document.getElementById('start-btn');
        
        const video = document.getElementById('ar-video');
        const uiPlayBtn = document.getElementById('ui-play-btn');
        const uiTimeline = document.getElementById('ui-timeline');

        sceneEl.addEventListener("arReady", () => {
            initText.innerText = "System einsatzbereit.";
            startBtn.style.display = "block";
        });

        startBtn.addEventListener('click', () => {
            loadingEl.style.display = 'none';
            if (video) {
                video.play().then(() => {
                    video.pause(); 
                    video.muted = false; 
                }).catch(err => console.log(err));
            }
        });

        // Controls-Logik
        uiPlayBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                uiPlayBtn.innerText = "⏸";
            } else {
                video.pause();
                uiPlayBtn.innerText = "▶";
            }
        });

        video.addEventListener('timeupdate', () => {
            if (!isNaN(video.duration)) {
                const percentage = (video.currentTime / video.duration) * 100;
                uiTimeline.value = percentage;
            }
        });

        uiTimeline.addEventListener('input', () => {
            if (!isNaN(video.duration)) {
                video.currentTime = (uiTimeline.value / 100) * video.duration;
            }
        });
    </script>
</body>
</html>
