<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanochemistry AR Portal</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111116; color: #fff; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: system-ui, -apple-system, sans-serif; text-align: center;
            padding: 20px; box-sizing: border-box; transition: opacity 0.4s ease;
        }
        .hidden { opacity: 0; pointer-events: none; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1); width: 40px; height: 40px;
            border-radius: 50%; border-left-color: #3b82f6;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin: 0 0 10px 0; font-weight: 600; font-size: 1.5rem; }
        p { margin: 0; color: #a1a1aa; font-size: 0.95rem; }
    </style>

    <script>
        // 1. Read URL Parameters before components load
        const urlParams = new URLSearchParams(window.location.search);
        const moleculeId = urlParams.get('id');

        // Safety fallback: If someone visits the root URL without an ID, default to 'mol1'
        const targetId = moleculeId ? moleculeId : 'mol1';

        // 2. Resolve target asset paths
        const targetMindPath = `./targets/${targetId}.mind`;
        const modelGlbPath = `./models/${targetId}.glb`;

        // 3. Inject configuration directly into elements when the DOM loads
        document.addEventListener("DOMContentLoaded", () => {
            const sceneEl = document.querySelector('a-scene');
            const modelEl = document.querySelector('a-gltf-model');

            // Set tracking source on the scene
            sceneEl.setAttribute('mindar-image', `imageTargetSrc: ${targetMindPath}; autoStart: true; uiLoading: no; uiScanning: no;`);
            // Set 3D file path on the model entity
            modelEl.setAttribute('src', modelGlbPath);

            // Handle UI Loading Screen Fade-out when tracking engine finishes initialization
            sceneEl.addEventListener("arReady", () => {
                document.getElementById('ui-overlay').classList.add('hidden');
            });
            
            // Optional: Error logging to catch missing files in the console
            sceneEl.addEventListener("arError", () => {
                document.querySelector('#ui-overlay p').innerText = "Camera or configuration error. Please ensure HTTPS execution.";
            });
        });
    </script>
</head>
<body>

    <div id="ui-overlay">
        <div class="spinner"></div>
        <h2>Initializing AR Environment...</h2>
        <p>Please allow camera permissions if prompted, then aim your lens back at the QR code.</p>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model position="0 0 0" 
                          scale="0.1 0.1 0.1" 
                          rotation="0 0 0">
            </a-gltf-model>
        </a-entity>
        
    </a-scene>

</body>
</html>
