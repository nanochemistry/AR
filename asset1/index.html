<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Asset Portal</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; color: #fff; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: sans-serif;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="loading">
        <h2>Loading 3D Experience...</h2>
        <p>Aim your camera at the QR code on the poster.</p>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
             embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="./model.glb" 
                          position="0 0 0" 
                          scale="0.1 0.1 0.1" 
                          rotation="0 0 0">
            </a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        document.querySelector('a-scene').addEventListener("arReady", () => {
            document.getElementById('loading').classList.add('hidden');
        });
    </script>
</body>
</html>
