<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Asset Portal</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000;
        }
        
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; color: #fff; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: sans-serif; text-align: center;
        }
        
        #start-btn {
            padding: 12px 24px; font-size: 16px; background: #3b82f6; color: white; 
            border: none; border-radius: 6px; cursor: pointer; margin-top: 15px;
            display: none;
        }

        /* Zwingt das von MindAR injizierte Video-Element, sich ohne 
          Verzerrung an den Smartphone-Bildschirm anzupassen (Portrait & Landscape)
        */
        video {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div id="loading">
        <h2>Nanochemistry AR Portal</h2>
        <p id="status-text">Initialisiere AR-Umgebung...</p>
        <button id="start-btn">AR Experience Starten</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
             embedded 
             renderer="colorManagement: true; physicallyCorrectLights: true;"
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .cantap"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-box position="0 0 0" scale="0.3 0.3 0.3" material="color: red; opacity: 0.9;"></a-box>
        </a-entity>
    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const loadingEl = document.getElementById('loading');
        const statusText = document.getElementById('status-text');
        const startBtn = document.getElementById('start-btn');

        sceneEl.addEventListener("arReady", () => {
            statusText.innerText = "Kamera und Tracker bereit!";
            startBtn.style.display = "block";
        });

        startBtn.addEventListener('click', () => {
            loadingEl.style.style.display = 'none';
        });

        sceneEl.addEventListener("arError", () => {
            statusText.innerText = "Kamera-Zugriff blockiert!";
        });
    </script>
</body>
</html>
