<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Asset Portal</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; color: #fff; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: sans-serif; text-align: center;
        }
        #start-btn {
            padding: 12px 24px; font-size: 16px; background: #3b82f6; color: white; 
            border: none; border-radius: 6px; cursor: pointer; margin-top: 15px;
            display: none; /* Wird erst sichtbar, wenn die Kamera bereit ist */
        }
    </style>
</head>
<body>

    <div id="loading">
        <h2>Nanochemistry AR Portal</h2>
        <p id="status-text">Initialisiere AR-Umgebung und Kamera...</p>
        <button id="start-btn">AR Experience Starten</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
             embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="./model.glb" 
                          position="0 0 0" 
                          scale="0.1 0.1 0.1" 
                          rotation="0 0 0">
            </a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const loadingEl = document.getElementById('loading');
        const statusText = document.getElementById('status-text');
        const startBtn = document.getElementById('start-btn');

        // Sobald MindAR die Kamera erfolgreich gestartet hat und bereit ist:
        sceneEl.addEventListener("arReady", () => {
            statusText.innerText = "Kamera erfolgreich geladen!";
            startBtn.style.display = "block"; // Zeige den Button an
        });

        // Wenn der Nutzer auf den Button klickt, blenden wir einfach das Overlay aus
        startBtn.addEventListener('click', () => {
            loadingEl.style.display = 'none';
        });

        // Falls die Kamera blockiert wird (z.B. durch Firefox-Rechte)
        sceneEl.addEventListener("arError", () => {
            statusText.innerText = "Kamera-Zugriff blockiert!";
            alert("Bitte erlaube der Website den Zugriff auf deine Kamera in den Browser-Einstellungen.");
        });
    </script>
</body>
</html>
