<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nanochemistry AR Portal</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000;
        }
        
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; color: #fff; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: sans-serif; text-align: center;
        }
        
        #start-btn {
            padding: 12px 24px; font-size: 16px; background: #3b82f6; color: white; 
            border: none; border-radius: 6px; cursor: pointer; margin-top: 15px;
            display: none;
        }

        video {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            position: absolute; top: 0; left: 0;
            z-index: 1 !important;
        }

        .a-canvas {
            width: 100vw !important;
            height: 100vh !important;
            position: absolute; top: 0; left: 0;
            z-index: 2 !important;
        }

        @media (orientation: landscape) {
            video {
                width: auto !important;
                height: 100vh !important;
                left: 50% !important;
                transform: translateX(-50%) !important;
                object-fit: contain !important;
            }
        }
    </style>

    <script>
        // EIGENE RECHNER-KOMPONENTE FÜR TOUCH-GESTEN
        AFRAME.registerComponent('gesture-handler', {
            schema: {
                rotationFactor: {default: 5},
                minScale: {default: 0.1},
                maxScale: {default: 5}
            },
            init: function () {
                this.handleTouchStart = this.handleTouchStart.bind(this);
                this.handleTouchMove = this.handleTouchMove.bind(this);
                
                this.isVisible = false;
                this.initialScale = this.el.object3D.scale.clone();
                this.scaleFactor = 1;
                
                // Gesten nur erlauben, wenn das Bild aktiv getrackt wird
                this.el.addEventListener('targetFound', () => { this.isVisible = true; });
                this.el.addEventListener('targetLost', () => { this.isVisible = false; });
                
                window.addEventListener('touchstart', this.handleTouchStart);
                window.addEventListener('touchmove', this.handleTouchMove);
            },
            handleTouchStart: function (event) {
                if (!this.isVisible) return;
                
                if (event.touches.length === 1) {
                    this.previousTouchX = event.touches[0].clientX;
                    this.previousTouchY = event.touches[0].clientY;
                } else if (event.touches.length === 2) {
                    this.initialSpread = this.getDistance(event.touches[0], event.touches[1]);
                    this.baseScale = this.scaleFactor;
                }
            },
            handleTouchMove: function (event) {
                if (!this.isVisible) return;
                
                if (event.touches.length === 1) {
                    // EIN FINGER: Rotation um X- und Y-Achse
                    const deltaX = event.touches[0].clientX - this.previousTouchX;
                    const deltaY = event.touches[0].clientY - this.previousTouchY;
                    
                    this.el.object3D.rotation.y += deltaX * (this.data.rotationFactor / 1000);
                    this.el.object3D.rotation.x += deltaY * (this.data.rotationFactor / 1000);
                    
                    this.previousTouchX = event.touches[0].clientX;
                    this.previousTouchY = event.touches[0].clientY;
                } else if (event.touches.length === 2) {
                    // ZWEI FINGER: Pinch-to-Zoom (Skalierung)
                    const currentSpread = this.getDistance(event.touches[0], event.touches[1]);
                    if (this.initialSpread > 0) {
                        const ratio = currentSpread / this.initialSpread;
                        this.scaleFactor = Math.max(this.data.minScale, Math.min(this.data.maxScale, this.baseScale * ratio));
                        
                        this.el.object3D.scale.set(
                            this.initialScale.x * this.scaleFactor,
                            this.initialScale.y * this.scaleFactor,
                            this.initialScale.z * this.scaleFactor
                        );
                    }
                }
            },
            getDistance: function (touch1, touch2) {
                const dx = touch1.clientX - touch2.clientX;
                const dy = touch1.clientY - touch2.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            },
            remove: function() {
                window.removeEventListener('touchstart', this.handleTouchStart);
                window.removeEventListener('touchmove', this.handleTouchMove);
            }
        });
    </script>
</head>
<body>

    <div id="loading">
        <h2>Nanochemistry AR Portal</h2>
        <p id="status-text">Initialisiere AR-Umgebung...</p>
        <button id="start-btn">AR Experience Starten</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
             embedded 
             renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false" mindar-image-camera></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" gesture-handler>
            
            <a-box position="0 0 0" scale="0.3 0.3 0.3" material="color: red; opacity: 0.9;"></a-box>
            
            </a-entity>
    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const loadingEl = document.getElementById('loading');
        const statusText = document.getElementById('status-text');
        const startBtn = document.getElementById('start-btn');

        sceneEl.addEventListener("arReady", () => {
            statusText.innerText = "System bereit!";
            startBtn.style.display = "block";
        });

        startBtn.addEventListener('click', () => {
            loadingEl.style.display = 'none';
        });
    </script>
</body>
</html>
