<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Touch Diagnostics Fixed</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000;
        }

        #touch-hud {
            position: fixed; top: 10px; left: 10px;
            width: 260px; background: rgba(0, 0, 0, 0.85);
            color: #00ff00; font-family: monospace; font-size: 12px;
            padding: 12px; border-radius: 8px; border: 1px solid #00ff00;
            z-index: 99999; pointer-events: none;
        }
        
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; color: #fff; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: sans-serif; text-align: center;
        }
        
        #start-btn {
            padding: 12px 24px; font-size: 16px; background: #3b82f6; color: white; 
            border: none; border-radius: 6px; cursor: pointer; margin-top: 15px;
            display: none;
        }

        video {
            width: 100vw !important; height: 100vh !important;
            object-fit: cover !important; position: absolute; top: 0; left: 0;
            z-index: 1 !important;
        }

        .a-canvas {
            width: 100vw !important; height: 100vh !important;
            position: absolute; top: 0; left: 0; z-index: 2 !important;
        }
    </style>

    <script>
        AFRAME.registerComponent('gesture-handler', {
            init: function () {
                this.hudLog = document.getElementById('hud-log');
                this.hudTarget = document.getElementById('hud-target');
                this.hudTouches = document.getElementById('hud-touches');
                
                this.isVisible = false;
                this.scaleFactor = 1;
                this.initialScale = this.el.object3D.scale.clone();

                this.handleTouchStart = this.handleTouchStart.bind(this);
                this.handleTouchMove = this.handleTouchMove.bind(this);

                // Sucht das übergeordnete MindAR-Target, um den Sichtbarkeitsstatus abzufragen
                const targetEntity = this.el.closest('[mindar-image-target]');
                if (targetEntity) {
                    targetEntity.addEventListener('targetFound', () => { 
                        this.isVisible = true; 
                        if(this.hudTarget) this.hudTarget.innerText = "JA (Aktiv)";
                    });
                    targetEntity.addEventListener('targetLost', () => { 
                        this.isVisible = false; 
                        if(this.hudTarget) this.hudTarget.innerText = "NEIN (Inaktiv)";
                    });
                }

                window.addEventListener('touchstart', this.handleTouchStart, {passive: false});
                window.addEventListener('touchmove', this.handleTouchMove, {passive: false});
            },
            
            handleTouchStart: function (event) {
                if (this.hudTouches) this.hudTouches.innerText = event.touches.length;
                if (!this.isVisible) return;

                if (event.touches.length === 1) {
                    this.previousTouchX = event.touches[0].clientX;
                    this.previousTouchY = event.touches[0].clientY;
                } else if (event.touches.length === 2) {
                    this.initialSpread = this.getDistance(event.touches[0], event.touches[1]);
                    this.baseScale = this.scaleFactor;
                }
            },
            
            handleTouchMove: function (event) {
                if (!this.isVisible) return;
                event.preventDefault(); 

                if (event.touches.length === 1) {
                    // Dreht nun isoliert den internen Container
                    const deltaX = event.touches[0].clientX - this.previousTouchX;
                    const deltaY = event.touches[0].clientY - this.previousTouchY;
                    
                    this.el.object3D.rotation.y += deltaX * 0.008;
                    this.el.object3D.rotation.x += deltaY * 0.008;
                    
                    this.previousTouchX = event.touches[0].clientX;
                    this.previousTouchY = event.touches[0].clientY;
                    if (this.hudLog) this.hudLog.innerText = `Rotiere... X: ${this.el.object3D.rotation.x.toFixed(2)}, Y: ${this.el.object3D.rotation.y.toFixed(2)}`;
                } else if (event.touches.length === 2) {
                    // Skaliert isoliert den internen Container
                    const currentSpread = this.getDistance(event.touches[0], event.touches[1]);
                    if (this.initialSpread > 0) {
                        const ratio = currentSpread / this.initialSpread;
                        this.scaleFactor = Math.max(0.2, Math.min(4, this.baseScale * ratio));
                        
                        this.el.object3D.scale.set(
                            this.initialScale.x * this.scaleFactor,
                            this.initialScale.y * this.scaleFactor,
                            this.initialScale.z * this.scaleFactor
                        );
                        if (this.hudLog) this.hudLog.innerText = `Skaliere... Multiplikator: ${this.scaleFactor.toFixed(2)}`;
                    }
                }
            },
            
            getDistance: function (touch1, touch2) {
                return Math.sqrt(Math.pow(touch1.clientX - touch2.clientX, 2) + Math.pow(touch1.clientY - touch2.clientY, 2));
            }
        });
    </script>
</head>
<body>

    <div id="touch-hud">
        <strong>[TOUCH DIAGNOSTICS]</strong>
        <hr style="border-color: #00ff00; margin: 5px 0;">
        <div>Target Visible: <span id="hud-target" style="color: #ffaa00;">NEIN (Inaktiv)</span></div>
        <div>Active Touches: <span id="hud-touches">0</span></div>
        <div style="margin-top: 5px; color: #fff;">Last Action:</div>
        <div id="hud-log" style="color: #00ffff; font-style: italic;">Warte auf Eingabe...</div>
    </div>

    <div id="loading">
        <h2>Nanochemistry AR Portal</h2>
        <p id="status-text">Initialisiere AR-Umgebung...</p>
        <button id="start-btn">AR Experience Starten</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
             embedded 
             renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false" mindar-image-camera></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            
            <a-entity gesture-handler>
                
                <a-box position="0 0 0" scale="1.0 1.0 1.0" material="color: red; opacity: 0.9;"></a-box>
                
                </a-entity>
        </a-entity>
    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const loadingEl = document.getElementById('loading');
        const statusText = document.getElementById('status-text');
        const startBtn = document.getElementById('start-btn');

        sceneEl.addEventListener("arReady", () => {
            statusText.innerText = "System bereit!";
            startBtn.style.display = "block";
        });

        startBtn.addEventListener('click', () => {
            loadingEl.style.display = 'none';
        });
    </script>
</body>
</html>
